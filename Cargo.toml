[package]
name = "loglens"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
dirs = "6.0.0"
iced = { version = "0.14", features = ["tokio", "svg"] }
keyring = { version = "3", features = [
    "apple-native",
    "windows-native",
    # Linux: pure-Rust secret-service over zbus. The runtime feature MUST stay
    # `async-io`, not `tokio`: with the tokio runtime, keyring calls made on the
    # main thread deadlock (keyring-3.6.3/src/secret_service.rs, "Tokio runtime
    # caution"), and all of secrets.rs is called from the iced main thread.
    "async-secret-service",
    "crypto-rust",
    "async-io",
] }
png = "0.17"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }

# Only for `attach_parent_console` in main.rs: a GUI subsystem release build has
# no console, so `--version` has to borrow the parent terminal's to print
# anything at all.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console"] }

# Compiles the icon and the version information block into the exe. Build
# scripts run on the host, so this is gated on the host being Windows, matching
# the `cfg(windows)` block in build.rs.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
cargo-husky = { version = "1.5.0", default-features = false, features = ["user-hooks"] }

[package]
name = "loglens"
version = "0.1.0"
edition = "2024"

[dependencies]
# `serde` is on for one field: `Config.last_update_check`, an RFC 3339
# `DateTime<Utc>` in the config file.
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde"] }
dirs = "6.0.0"
iced = { version = "0.14", features = ["tokio", "svg"] }
keyring = { version = "3", features = [
    "apple-native",
    "windows-native",
    # Linux: pure-Rust secret-service over zbus. The runtime feature MUST stay
    # `async-io`, not `tokio`: with the tokio runtime, keyring calls made on the
    # main thread deadlock (keyring-3.6.3/src/secret_service.rs, "Tokio runtime
    # caution"), and all of secrets.rs is called from the iced main thread.
    "async-secret-service",
    "crypto-rust",
    "async-io",
] }
png = "0.17"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# Verifying a downloaded Artifact against the Release's SHA256SUMS. With
# nothing code-signed this is the only integrity check there is: it does not
# defend against someone who controls the Release, since they would control the
# checksums too, but it catches a truncated or corrupted download and a
# tampered hop on the way.
sha2 = "0.10"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }

# Two Win32 calls, both in main.rs. `Win32_Foundation` and `Win32_System_Console`
# are for `attach_parent_console`: a GUI subsystem release build has no console,
# so `--version` has to borrow the parent terminal's to print anything at all.
# `Win32_System_Recovery` is for `register_for_restart`, which tells the Restart
# Manager how to start Log Lens again after a silent in-app Update has closed
# it.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_Recovery",
] }

# Compiles the icon and the version information block into the exe. Build
# scripts run on the host, so this is gated on the host being Windows, matching
# the `cfg(windows)` block in build.rs.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
cargo-husky = { version = "1.5.0", default-features = false, features = ["user-hooks"] }
